services:
  - type: web
    name: vortiq
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: VORTIQ_LLM_TIMEOUT
        value: "120"
      - key: VORTIQ_REQUEST_TIMEOUT
        value: "15"
